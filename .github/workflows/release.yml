name: Release KymEngine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            glslang-tools libvulkan-dev zlib1g-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure & Build
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ -z "$TAG_VER" || "$TAG_VER" == "main" ]]; then TAG_VER="0.1.1"; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKYMENGINE_VERSION="$TAG_VER"
          cmake --build build -j

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux (.tar.gz, .deb & .AppImage)
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ -z "$TAG_VER" || "$TAG_VER" == "main" ]]; then TAG_VER="0.1.1"; fi
          mkdir -p dist/KymEngine-linux-x64/java
          cp build/hub/KymEngineHub dist/KymEngine-linux-x64/
          cp build/editor/KyumistEditor dist/KymEngine-linux-x64/
          cp build/runtime/KyumistRuntime dist/KymEngine-linux-x64/
          cp build/java/kyumist-api.jar dist/KymEngine-linux-x64/java/
          cp -r assets examples Documentacion LICENSE dist/KymEngine-linux-x64/
          printf '%s\n' '#!/usr/bin/env bash' 'cd "$(dirname "$0")" || exit 1' 'exec ./KymEngineHub "$@"' > dist/KymEngine-linux-x64/KymEngine.sh
          chmod +x dist/KymEngine-linux-x64/KymEngineHub dist/KymEngine-linux-x64/KyumistEditor dist/KymEngine-linux-x64/KyumistRuntime dist/KymEngine-linux-x64/KymEngine.sh
          tar -C dist -czf KymEngine-linux-x64.tar.gz KymEngine-linux-x64

          chmod +x packaging/build_deb.sh packaging/build_appimage.sh
          ./packaging/build_deb.sh "$TAG_VER"
          curl -fsSL -L "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          ./packaging/build_appimage.sh "$TAG_VER"
          cp build/dist/kymengine_${TAG_VER}_*.deb build/dist/KymEngine-${TAG_VER}-x86_64.AppImage .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            KymEngine-linux-x64.tar.gz
            kymengine_*.deb
            KymEngine-*.AppImage

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          $sdkDir = "C:\VulkanSDK"
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--root", $sdkDir, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          Remove-Item $installer -Force
          "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure & Build
        shell: pwsh
        run: |
          $tagVer = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { "0.1.1" }
          cmake -B build -A x64 "-DKYMENGINE_VERSION=$tagVer"
          cmake --build build --config Release -j

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PATH = "$env:JAVA_HOME\bin\server;$env:JAVA_HOME\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows (.zip & setup .exe)
        shell: pwsh
        run: |
          $tagVer = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { "0.1.1" }
          New-Item -ItemType Directory -Force -Path dist\KymEngine-windows-x64\java | Out-Null
          Copy-Item build\hub\Release\KymEngineHub.exe dist\KymEngine-windows-x64\
          Copy-Item build\editor\Release\KyumistEditor.exe dist\KymEngine-windows-x64\
          Copy-Item build\runtime\Release\KyumistRuntime.exe dist\KymEngine-windows-x64\
          Copy-Item build\java\kyumist-api.jar dist\KymEngine-windows-x64\java\
          Copy-Item -Recurse assets,examples,Documentacion,LICENSE dist\KymEngine-windows-x64\
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.logging,jdk.compiler --output dist\KymEngine-windows-x64\jre --strip-debug --no-man-pages --no-header-files --compress=2
          @(
            '@echo off',
            'cd /d "%~dp0"',
            'if exist "%~dp0jre\bin\server\jvm.dll" (',
            '  set "JAVA_HOME=%~dp0jre"',
            '  set "PATH=%~dp0jre\bin\server;%~dp0jre\bin;%PATH%"',
            ') else if defined JAVA_HOME (',
            '  set "PATH=%JAVA_HOME%\bin\server;%JAVA_HOME%\bin;%PATH%"',
            ')',
            'start "" "KymEngineHub.exe" %*'
          ) | Set-Content -Encoding ASCII dist\KymEngine-windows-x64\KymEngine.bat
          Compress-Archive -Path dist\KymEngine-windows-x64 -DestinationPath KymEngine-windows-x64.zip
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Null
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis "/DVERSION=$tagVer" "/DDIST_DIR=$PWD\dist\KymEngine-windows-x64" "/DOUT_FILE=$PWD\KymEngine-$tagVer-win64-setup.exe" packaging\windows\kymengine.nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            KymEngine-windows-x64.zip
            KymEngine-*-win64-setup.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            artifacts/*
