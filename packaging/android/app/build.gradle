plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kyumist.android'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.kyumist.game'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.4.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += ['../../../java-api/src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
