plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kyumist.android'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.kyumist.game'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.3.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
